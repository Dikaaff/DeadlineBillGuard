services:
  - type: web
    name: deadline-bill-guard
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DBG_DATA_DIR
        value: /data
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REMINDER_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
    disk:
      name: bill-guard-data
      mountPath: /data
      sizeGB: 1
